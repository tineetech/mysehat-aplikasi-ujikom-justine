<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galeri — MySehat</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: {
  fontFamily: { sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'] },
  colors: { brand: { DEFAULT: '#0f766e', dark: '#0b5c56', light: '#5eead4' } }
}}};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js" defer crossorigin="anonymous"></script>
<style>
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); --bg1:#e6f7f4; --bg2:#c9ece6; --ink:#1f2b2a; --muted:#5b6d6b; --card:#ffffff; --line:#e3efed; }
:root[data-theme="dark"] { --bg1:#0c1f1e; --bg2:#0f2e2b; --ink:#e8f5f3; --muted:#9bb5b1; --card:#132a28; --line:#1f3d3a; }
html { scroll-behavior: smooth; scroll-padding-top: 90px; }
body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: var(--ink); background: linear-gradient(180deg, var(--bg2) 0%, var(--bg1) 45%, var(--bg1) 100%); min-height: 100vh; }
.card { background: var(--card); border: 1px solid var(--line); }
.muted { color: var(--muted); }
.stripes { background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.28) 0 2px, transparent 2px 90px); }
:root[data-theme="dark"] .stripes { background-image: none; }
.orbs { display: none; }
:root[data-theme="dark"] .orbs { display: block; }
.orb { position: fixed; border-radius: 9999px; background: rgba(94,234,212,.07); border: 1px solid rgba(94,234,212,.18); }
.shot img { transition: transform .6s ease; }
.shot:hover img { transform: scale(1.04); }
.shot .cap { opacity: 0; transition: opacity .3s; background: linear-gradient(0deg, rgba(6,47,44,.65), transparent); }
.shot:hover .cap, .shot:focus-visible .cap { opacity: 1; }
@media (hover: none) { .shot .cap { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
:focus-visible { outline: 2px solid #0f766e; outline-offset: 2px; }
</style>
</head>
<body>
<div class="stripes fixed inset-0 pointer-events-none" aria-hidden="true"></div>
<div class="orbs pointer-events-none" aria-hidden="true">
  <span class="orb" style="width:280px;height:280px;top:-70px;right:-60px"></span>
  <span class="orb" style="width:150px;height:150px;top:46%;left:-40px"></span>
  <span class="orb" style="width:90px;height:90px;bottom:12%;right:8%"></span>
</div>

<header class="relative z-20 px-4 pt-4">
  <nav class="card mx-auto max-w-6xl rounded-full flex items-center justify-between pl-6 pr-2 py-2 shadow-sm">
    <a href="mysehat.html" class="flex items-center gap-2 font-extrabold text-xl text-brand"><i class="fa-solid fa-heart-pulse text-2xl"></i>MySehat</a>
    <ul class="hidden md:flex items-center gap-8 text-sm font-medium">
      <li><a href="mysehat.html" class="muted hover:text-brand">Beranda</a></li>
      <li><a href="produk.html" class="muted hover:text-brand">Produk</a></li>
      <li><a href="galeri.html" aria-current="page" class="flex items-center gap-2 text-brand"><span class="w-1.5 h-1.5 rounded-full bg-brand"></span>Galeri</a></li>
    </ul>
    <div class="flex items-center gap-2">
      <button id="themeBtn" aria-label="Ganti tema" class="w-9 h-9 rounded-full grid place-items-center hover:bg-black/5"><i class="fa-solid fa-moon"></i></button>
      <a href="mysehat.html#kontak" class="hidden sm:inline-block card rounded-full px-5 py-2.5 text-sm font-semibold shadow-sm hover:shadow">Minta Demo</a>
      <button id="menuBtn" aria-label="Buka menu" class="md:hidden w-9 h-9 rounded-full grid place-items-center hover:bg-black/5"><i class="fa-solid fa-bars"></i></button>
    </div>
  </nav>
  <div id="mobileMenu" class="hidden md:hidden card mx-auto max-w-6xl rounded-3xl mt-2 p-4 text-sm font-medium space-y-3">
    <a href="mysehat.html" class="block">Beranda</a><a href="produk.html" class="block">Produk</a><a href="galeri.html" class="block">Galeri</a>
  </div>
</header>

<main class="relative z-10 px-3 sm:px-4 max-w-[1400px] mx-auto pt-12 md:pt-16 pb-20">
  <div class="px-1 sm:px-2">
    <span class="card inline-block rounded-full px-4 py-1.5 text-xs font-medium">Galeri</span>
    <h1 class="text-3xl md:text-5xl font-bold tracking-tight mt-5 leading-tight">Galeri fasilitas rumah sakit</h1>
  </div>
  <div id="gal" class="columns-1 sm:columns-2 lg:columns-3 gap-3 mt-10"></div>
</main>

<footer class="relative z-10 text-center text-xs muted pb-8">©2026 MySehat</footer>

<!-- Lightbox -->
<div id="lb" class="hidden fixed inset-0 z-50 items-center justify-center p-4 md:p-10" style="background:rgba(6,25,23,.92)" role="dialog" aria-modal="true" aria-label="Pratinjau foto">
  <button id="lbClose" aria-label="Tutup" class="absolute top-4 right-4 w-11 h-11 rounded-full text-white hover:bg-white/15 text-lg"><i class="fa-solid fa-xmark"></i></button>
  <button id="lbPrev" aria-label="Foto sebelumnya" class="absolute left-3 md:left-6 top-1/2 -translate-y-1/2 w-11 h-11 rounded-full text-white hover:bg-white/15"><i class="fa-solid fa-chevron-left"></i></button>
  <button id="lbNext" aria-label="Foto berikutnya" class="absolute right-3 md:right-6 top-1/2 -translate-y-1/2 w-11 h-11 rounded-full text-white hover:bg-white/15"><i class="fa-solid fa-chevron-right"></i></button>
  <figure class="max-w-5xl w-full text-center">
    <div id="lbMedia" class="relative mx-auto w-full max-h-[78vh] rounded-xl overflow-hidden"></div>
    <figcaption id="lbCap" class="text-white/90 text-sm mt-4 font-medium"></figcaption>
  </figure>
</div>

<script>
// [keterangan, ikon, lebar, tinggi]
const G = [
  ['Ruang Rawat Inap','fa-bed-pulse',1000,1250],['Lobi Utama','fa-hospital',1200,800],['Poli Anak','fa-baby',1000,1000],
  ['Laboratorium','fa-flask-vial',1000,1300],['IGD','fa-truck-medical',1200,800],['Farmasi','fa-pills',1000,900],
  ['Taman Pemulihan','fa-tree',1000,1200],['Ruang Operasi','fa-user-doctor',1200,850],['Radiologi','fa-x-ray',1000,1100],
  ['Ruang Tunggu','fa-couch',1200,800],['Poli Gigi','fa-tooth',1000,1250],['Ruang Konsultasi','fa-stethoscope',1000,900]
].map(([cap, icon, w, h], i) => ({cap, icon, w, h, img: `https://picsum.photos/seed/mysehat-gal${i + 1}/${w}/${h}`}));
const grad = ['#c8efe8,#bfe4f5','#d9f5f0,#e3e0fb','#bfe4f5,#d2f0ec','#f8e6d2,#c8efe8','#a9dceb,#d9f5f0','#d2f0ec,#8fd8cf'];
const media = (g, i, cls = '') => `<div class="relative ${cls}" style="aspect-ratio:${g.w}/${g.h};background:linear-gradient(135deg,${grad[i % 6]})"><div class="absolute inset-0 grid place-items-center text-5xl" style="color:rgba(15,118,110,.35)"><i class="fa-solid ${g.icon}"></i></div><img src="${g.img}" alt="${g.cap}" loading="lazy" onerror="this.remove()" class="absolute inset-0 w-full h-full object-cover"></div>`;

gal.innerHTML = G.map((g, i) => `<button data-i="${i}" class="shot group relative block w-full mb-3 overflow-hidden rounded-xl break-inside-avoid text-left" aria-label="Lihat ${g.cap}">${media(g, i)}<span class="cap absolute inset-x-0 bottom-0 p-4 pt-12 text-white text-sm font-semibold">${g.cap}</span></button>`).join('');

// Lightbox
let cur = 0;
function show(i) {
  cur = (i + G.length) % G.length;
  lbMedia.innerHTML = media(G[cur], cur, 'w-full');
  lbMedia.firstElementChild.style.maxHeight = '78vh';
  lbCap.textContent = `${G[cur].cap} · ${cur + 1}/${G.length}`;
}
function open_(i) { show(i); lb.classList.remove('hidden'); lb.classList.add('flex'); document.body.style.overflow = 'hidden'; lbClose.focus(); }
function close_() { lb.classList.add('hidden'); lb.classList.remove('flex'); document.body.style.overflow = ''; }
gal.onclick = e => { const b = e.target.closest('.shot'); if (b) open_(+b.dataset.i); };
lbClose.onclick = close_; lbPrev.onclick = () => show(cur - 1); lbNext.onclick = () => show(cur + 1);
lb.onclick = e => { if (e.target === lb) close_(); };
document.addEventListener('keydown', e => {
  if (lb.classList.contains('hidden')) return;
  if (e.key === 'Escape') close_(); if (e.key === 'ArrowLeft') show(cur - 1); if (e.key === 'ArrowRight') show(cur + 1);
});

// Menu & tema
const mm = document.getElementById('mobileMenu');
document.getElementById('menuBtn').onclick = () => mm.classList.toggle('hidden');
themeBtn.onclick = () => {
  const dark = document.documentElement.dataset.theme === 'dark';
  document.documentElement.dataset.theme = dark ? 'light' : 'dark';
  themeBtn.innerHTML = `<i class="fa-solid fa-${dark ? 'moon' : 'sun'}"></i>`;
};
</script>
</body>
</html>
